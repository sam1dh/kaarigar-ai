name: build-backend

# Phase 5: the student subscription cannot use ACR Tasks (TasksOperationsNotAllowed),
# and the laptop uplink is too slow to push a ~1.4 GB image. Build on a GitHub runner
# and push the image straight to Azure Container Registry.
#
#   gh workflow run build-backend.yml --ref phase5-deploy -f tag=phase5-YYYYMMDDHHMM
#
# Requires repository secrets ACR_USERNAME and ACR_PASSWORD (ACR admin credentials).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to build and push
        required: true
        default: phase5

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: kaarigaracr7035.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: kaarigaracr7035.azurecr.io/kaarigar-backend:${{ github.event.inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
