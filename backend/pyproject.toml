[project]
name = "kaarigar-backend"
version = "0.1.0"
description = "Kaarigar AI — voice-first repair copilot for Indian shop floors (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "supabase>=2.5",
    "PyJWT[crypto]>=2.8",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() in defaults is the intended pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
